---
- name: Create ServiceNow incident from Prometheus alert
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Create incident in ServiceNow
      servicenow.itsm.incident:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_username }}"
          password: "{{ snow_password }}"
        state: new
        short_description: "{{ summary }}"
        description: |
          Alert Name: {{ alert_name }}
          Host: {{ instance }}
          Mount Point: {{ mountpoint }}
          Severity: {{ severity }}

          Details:
          {{ description }}

          Source: Prometheus Alertmanager via AAP EDA
        impact: medium
        urgency: medium
      register: snow_incident

    - name: Show created incident
      debug:
        var: snow_incident
