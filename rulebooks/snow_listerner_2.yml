---
- name: ServiceNow Incident AI Analysis
  hosts: localhost

  sources:
    - name: Listen to ServiceNow
      servicenow.itsm.records:
        instance:
          host: "{{ snow_instance }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        table: incident
        interval: 5
        remote_servicenow_timezone: GMT

  rules:
    - name: Send Incident to AI
      condition: event.number is defined
      action:
        run_job_template:
          name: Ask AI
          organization: Default
          job_args:
            extra_vars:
              incident_number: "{{ event.number }}"
              incident_sys_id: "{{ event.sys_id }}"
              short_description: "{{ event.short_description }}"
              description: "{{ event.description | default('') }}"
              
