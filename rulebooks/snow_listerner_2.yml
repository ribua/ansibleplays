---
- name: Watch for new incidents in ServiceNow
  hosts: localhost

  sources:
    - name: Listen to ServiceNow
      servicenow.itsm.records:
        instance:
          host:  "{{ snow_instance }}"
          username: "{{ snow_username }}"
          password: "{{ snow_password }}"
        table: incident
        interval: 1        
        timezone: Australia/Melbourne

  rules:
    - name: Display full ServiceNow incident event
      condition: event is defined
      action:
        debug:
          msg: "{{ event }}"
